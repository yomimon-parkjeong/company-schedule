<dialog id="salesRecordDialog" aria-labelledby="salesRecordTitle" aria-describedby="salesRecordDescription">
 <div class="dialog-head"><div><h2 id="salesRecordTitle">상세 매출 기록</h2><p id="salesRecordIdentity" class="sales-record-identity"></p></div><button id="closeSalesRecords" type="button" aria-label="상세 매출 기록 닫기">×</button></div>
 <div class="sales-record-body">
  <p id="salesRecordDescription" class="sales-record-description">저장된 일정과 연결된 정산 기록을 확인합니다. 닫으면 입력 중이던 일정 상세 편집창으로 돌아갑니다.</p>
  <div class="sales-record-scopes" role="group" aria-label="매출 기록 조회 범위"><button id="salesRecordAll" type="button" aria-pressed="true">인플루언서 누적</button><button id="salesRecordCurrent" type="button" aria-pressed="false">이 일정</button></div>
  <div id="salesRecordSummary" class="sales-record-summary"></div>
  <p id="salesRecordCoverage" class="sales-record-coverage" role="status" aria-live="polite"></p>
  <div class="sales-record-table-wrap"><table class="sales-record-table"><caption id="salesRecordCaption">정산 기간별 내역</caption><thead><tr><th scope="col">정산 구분 / 기간</th><th scope="col">공구 / 상품</th><th scope="col">판매건수</th><th scope="col">주문금액</th><th scope="col">수수료(세전)</th><th scope="col">지급 예정액</th><th scope="col">지급 상태 / 완료액</th></tr></thead><tbody id="salesRecordRows"></tbody></table></div>
  <p id="salesRecordEmpty" class="sales-record-empty" hidden>연결된 정산 기록이 없습니다.</p>
  <p class="sales-record-description">주문금액은 취소·반품 차감 전 금액입니다. 미등록 수수료와 지급 정보는 추정하지 않습니다.</p>
 </div>
 <div class="dialog-foot"><button id="returnSalesRecords" type="button" class="primary">일정 상세 편집으로 돌아가기</button></div>
</dialog>
