<div class="form-grid"><label class="full">일정명<input id="editTitle" type="text" required maxlength="200" placeholder="인플루언서 ex. 닉네임(이름)"><small class="field-hint">상품을 입력하면 닉네임(이름) - 상품으로 표시됩니다.</small></label><label>상품<input id="editProduct" type="text" maxlength="120"></label><label>업무 유형<select id="editType"><option>공동구매</option><option>행사</option><option>발송</option><option>페이백</option><option>기타</option></select></label><label>시작일<input id="editStart" type="date" required></label><label>종료일<input id="editEnd" type="date" required></label><fieldset class="sales-fields"><legend>매출</legend><label>주문·결제 건수 (건)<input type="number" id="editSalesCount" min="0" max="1000000000" step="1" placeholder="미입력"></label><label>매출액 (원)<input type="number" id="editSalesAmount" min="0" max="1000000000000" step="1" placeholder="미입력"></label><p class="field-hint">주문·결제 건수를 입력합니다. 빈칸은 미입력이며, 실적이 0이면 0을 입력하세요.</p></fieldset><label class="full cancel-field"><input id="editCanceled" type="checkbox">취소 일정</label></div><p class="edit-note">전달 이미지의 원본 일정명은 보존됩니다. 변경은 현재 화면에 반영되며 엑셀로 내보낼 수 있습니다.</p><p class="error" id="editError" role="alert"></p>
